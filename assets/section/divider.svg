<svg width="100%" height="46" viewBox="0 0 900 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9CB" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00D9CB"/>
      <stop offset="50%" stop-color="#109EE6"/>
      <stop offset="85%" stop-color="#BD49FF"/>
      <stop offset="100%" stop-color="#BD49FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .core { animation: divPulse 2.6s ease-in-out infinite; }
    @keyframes divPulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
    .sweep { animation: divSweep 3s linear infinite; }
    @keyframes divSweep { 0%{transform:translateX(-260px);} 100%{transform:translateX(260px);} }
    .dot { animation: divDot 2.6s ease-in-out infinite; }
    @keyframes divDot { 0%,100%{r:3;opacity:0.6;} 50%{r:5;opacity:1;} }
  </style>

  <line class="core" x1="30" y1="23" x2="870" y2="23" stroke="url(#divGrad)" stroke-width="2"/>
  <g class="sweep">
    <rect x="380" y="15" width="140" height="16" rx="8" fill="#5AFFF0" opacity="0.15"/>
  </g>
  <circle class="dot" cx="450" cy="23" r="4" fill="#5AFFF0"/>
</svg>
