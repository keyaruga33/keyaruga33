<svg width="100%" height="60" viewBox="0 0 900 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9CB" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00D9CB"/>
      <stop offset="50%" stop-color="#109EE6"/>
      <stop offset="85%" stop-color="#BD49FF"/>
      <stop offset="100%" stop-color="#BD49FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5AFFF0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#109EE6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#BD49FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .core { animation: divPulse2 2.6s ease-in-out infinite; }
    @keyframes divPulse2 { 0%,100%{opacity:0.55;} 50%{opacity:1;} }

    .sweep1 { animation: divSweep1 3.4s linear infinite; }
    @keyframes divSweep1 { 0%{transform:translateX(-320px);} 100%{transform:translateX(320px);} }

    .sweep2 { animation: divSweep2 4.6s linear infinite reverse; opacity:0.6; }
    @keyframes divSweep2 { 0%{transform:translateX(-320px);} 100%{transform:translateX(320px);} }

    .glowCore { animation: glowPulse 2.6s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100%{opacity:0.5; r:14;} 50%{opacity:1; r:20;} }

    .diamond { animation: diamondSpin 6s linear infinite, diamondPulse 2.6s ease-in-out infinite; transform-origin: 450px 30px; }
    @keyframes diamondSpin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes diamondPulse { 0%,100%{opacity:0.7;} 50%{opacity:1;} }

    .dot { animation: divDot2 2.6s ease-in-out infinite; }
    @keyframes divDot2 { 0%,100%{r:2.5;opacity:0.4;} 50%{r:4.5;opacity:1;} }

    .spark { animation: sparkTwinkle 1.8s ease-in-out infinite; }
    @keyframes sparkTwinkle { 0%,100%{opacity:0.2; transform:scale(0.7);} 50%{opacity:1; transform:scale(1.1);} }
  </style>

  <line class="core" x1="30" y1="30" x2="870" y2="30" stroke="url(#divGrad2)" stroke-width="1.5"/>
  <circle class="glowCore" cx="450" cy="30" r="16" fill="url(#coreGlow)" filter="url(#softGlow)"/>

  <g class="sweep1">
    <rect x="380" y="21" width="160" height="18" rx="9" fill="#5AFFF0" opacity="0.18"/>
  </g>
  <g class="sweep2">
    <rect x="400" y="24" width="100" height="12" rx="6" fill="#BD49FF" opacity="0.18"/>
  </g>

  <g class="diamond" filter="url(#softGlow)">
    <path d="M450 22 L458 30 L450 38 L442 30 Z" fill="#5AFFF0"/>
  </g>

  <circle class="dot" cx="390" cy="30" r="3" fill="#00D9CB" style="animation-delay:0s"/>
  <circle class="dot" cx="510" cy="30" r="3" fill="#BD49FF" style="animation-delay:0.6s"/>
  <circle class="dot" cx="330" cy="30" r="2" fill="#109EE6" style="animation-delay:1.2s"/>
  <circle class="dot" cx="570" cy="30" r="2" fill="#109EE6" style="animation-delay:1.8s"/>

  <circle class="spark" cx="250" cy="30" r="1.6" fill="#5AFFF0" style="animation-delay:0.3s"/>
  <circle class="spark" cx="650" cy="30" r="1.6" fill="#BD49FF" style="animation-delay:0.9s"/>
  <circle class="spark" cx="150" cy="30" r="1.3" fill="#00D9CB" style="animation-delay:1.4s"/>
  <circle class="spark" cx="750" cy="30" r="1.3" fill="#109EE6" style="animation-delay:0.5s"/>
</svg>
