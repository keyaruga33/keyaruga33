<svg width="100%" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9CB"/>
      <stop offset="60%" stop-color="#109EE6"/>
      <stop offset="100%" stop-color="#BD49FF"/>
    </linearGradient>
    <filter id="statGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="stClip"><rect width="900" height="300" rx="14"/></clipPath>
  </defs>

  <style>
    text { font:500 15px 'Consolas','Fira Code',monospace; fill:#DCF0FF; }
    .lbl { fill:#A0B4CC; font-size:13px; letter-spacing:2px; }
    .val { font-size:30px; font-weight:700; fill:url(#statGrad); filter:url(#statGlow); }
    .head { animation:headBlink 2.4s ease-in-out infinite; }
    @keyframes headBlink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .flick { animation:fBorder 6s steps(24) infinite; }
    @keyframes fBorder { 0%,100%{opacity:0.8;} 40%{opacity:0.3;} 42%{opacity:0.8;} }
    .cell { animation:cellIn 0.6s ease-out both; }
    @keyframes cellIn { 0%{opacity:0;transform:translateY(8px);} 100%{opacity:1;} }
  </style>

  <g clip-path="url(#stClip)">
    <rect width="900" height="300" fill="#0E1424"/>
    <rect width="900" height="34" fill="#080D19"/>
    <circle class="head" cx="20" cy="17" r="5" fill="#00D9CB"/>
    <text x="34" y="22" class="lbl">system_stats.log</text>
    <text x="880" y="22" text-anchor="end" class="lbl">synced: 2026-09-02 04:41 UTC</text>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#1E3448"/>

      <g transform="translate(48,112)" class="cell" style="animation-delay:0.00s">
        <rect x="-16" y="-40" width="4" height="58" rx="2" fill="url(#statGrad)"/>
        <text class="lbl" x="0" y="-22">ACCOUNT AGE</text>
        <text class="val" x="0" y="10">360 days</text>
      </g>
      <g transform="translate(48,190)" class="cell" style="animation-delay:0.12s">
        <rect x="-16" y="-40" width="4" height="58" rx="2" fill="url(#statGrad)"/>
        <text class="lbl" x="0" y="-22">TOTAL STARS</text>
        <text class="val" x="0" y="10">143</text>
      </g>
      <g transform="translate(48,268)" class="cell" style="animation-delay:0.24s">
        <rect x="-16" y="-40" width="4" height="58" rx="2" fill="url(#statGrad)"/>
        <text class="lbl" x="0" y="-22">REPOSITORIES</text>
        <text class="val" x="0" y="10">7</text>
      </g>
      <g transform="translate(486,112)" class="cell" style="animation-delay:0.36s">
        <rect x="-16" y="-40" width="4" height="58" rx="2" fill="url(#statGrad)"/>
        <text class="lbl" x="0" y="-22">TOTAL COMMITS</text>
        <text class="val" x="0" y="10">—</text>
      </g>
      <g transform="translate(486,190)" class="cell" style="animation-delay:0.48s">
        <rect x="-16" y="-40" width="4" height="58" rx="2" fill="url(#statGrad)"/>
        <text class="lbl" x="0" y="-22">FOLLOWERS</text>
        <text class="val" x="0" y="10">15</text>
      </g>
      <g transform="translate(486,268)" class="cell" style="animation-delay:0.60s">
        <rect x="-16" y="-40" width="4" height="58" rx="2" fill="url(#statGrad)"/>
        <text class="lbl" x="0" y="-22">TOTAL FORKS</text>
        <text class="val" x="0" y="10">4</text>
      </g>
    <rect class="flick" x="1" y="1" width="898" height="298"
          rx="13" fill="none" stroke="#BD49FF" stroke-width="1.5"/>
  </g>
</svg>
